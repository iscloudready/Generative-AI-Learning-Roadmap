<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b7a75"/>
      <stop offset="50%" style="stop-color:#075d59"/>
      <stop offset="100%" style="stop-color:#17211b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#b57817"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>
  <rect width="600" height="300" fill="url(#accent)" opacity="0.6"/>
  <circle cx="1050" cy="60" r="180" fill="#2dd4bf" opacity="0.04"/>
  <circle cx="1100" cy="250" r="120" fill="#fbbf24" opacity="0.03"/>
  <text x="60" y="95" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#fbbf24" font-weight="800" letter-spacing="2">GENAI ROADMAP</text>
  <text x="60" y="155" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="52" fill="#ffffff" font-weight="800" letter-spacing="-2">Generative AI</text>
  <text x="60" y="215" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="52" fill="#ffffff" font-weight="800" letter-spacing="-2">Learning Roadmap</text>
  <text x="60" y="252" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.75)" font-weight="400">From first principles to production systems — 4 phases, 16 tracks, 200+ resources</text>
  <rect x="60" y="270" width="50" height="3" rx="1.5" fill="url(#gold)"/>
  <!-- Stats -->
  <g transform="translate(760, 60)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="60" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#ffffff" font-weight="850">4</text>
    <text x="60" y="55" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="600" letter-spacing="0.5">PHASES</text>
  </g>
  <g transform="translate(890, 60)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="60" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#ffffff" font-weight="850">16</text>
    <text x="60" y="55" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="600" letter-spacing="0.5">TRACKS</text>
  </g>
  <g transform="translate(1020, 60)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="60" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#ffffff" font-weight="850">200+</text>
    <text x="60" y="55" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="600" letter-spacing="0.5">RESOURCES</text>
  </g>
</svg>
